const field=(name,label,type='text',value='',attrs='',prefix='forms')=>`<div class="field">${e('label',prefix+'.'+name+'.label',label,`for="${prefix}-${name}"`)}<input id="${prefix}-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs}></div>`;
const select=(name,label,options,value='',attrs='',prefix='forms')=>`<div class="field">${e('label',prefix+'.'+name+'.label',label,`for="${prefix}-${name}"`)}<select id="${prefix}-${name}" name="${name}" ${attrs}>${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
const notice=(text,k='')=>`<div class="notice">${k?e('p',k,text):`<p>${esc(text)}</p>`}</div>`;
const stat=(label,value)=>`<div class="stat-line"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
const empty=(title,text,route,label='Clear filters')=>`<div class="empty"><h2>${esc(title)}</h2><p>${esc(text)}</p>${a(route,label,'btn quiet')}</div>`;
const sectionHead=(k,title,route='',label='Explore all')=>`<div class="section-head">${e('h2',k,title)}${route?a(route,label,'text-link',k+'.link'):''}</div>`;
const intro=(k,title,text,eyebrow='')=>`<div class="page-intro">${eyebrow?e('span',k+'.eyebrow',eyebrow,'class="eyebrow"'):''}${e('h1',k+'.heading',title)}${text?e('p',k+'.text',text,'class="lead"'):''}</div>`;

btn quiet full" type="submit">${e('span',k+'.purchase.button','Add service to basket')}${icon('bag')}</button></form></div></aside></div></div><section class="section wash"><div class="container">${sectionHead(k+'.related.heading','You may also want to explore.')}<div class="grid three">${SERVICES.filter(x=>x.category===s.category&&x.id!==s.id).slice(0,3).map(x=>serviceCard(x)).join('')}</div></div></section>`;}
function mapPanel(items){return `<div class="map-panel"><div class="map-label">${icon('pin')} Map preview</div><div class="map-markers">${items.slice(0,8).map((b,i)=>`<a class="map-pin" style="left:${[18,47,77,30,66,15,49,83][i]}%;top:${[18,14,24,48,52,80,83,79][i]}%" href="#pharmacy?id=${b.id}" aria-label="${esc(b.name)}">${i+1}</a>`).join('')}</div><div class="map-caption">${e('strong','map.heading','The nearest pharmacy offering your service.')}${e('p','map.description','With your permission, use your location to sort pharmacies by distance. Choosing a service shows only pharmacies offering it, then puts the closest available locations first.','class="small"')}<p class="small">Schematic map: pins illustrate the layout. Distance ordering uses branch coordinates; it is not travel time.</p>${items.length>8?`<p class="small">${items.length} matching pharmacies; 8 illustrative pins shown. The list contains every result.</p>`:''}</div></div>`;}

let travelPreviewMode='';
function travelPreview(){return `<div class="travel-preview">${select('mode','Travel time preview',[['','Off'],['driving','Driving · example'],['walking','Walking · example']],travelPreviewMode,'data-change="travel-preview"','travel-preview')}<p class="small">${travelPreviewMode?'Illustrative journey times only, not calculated from your location. Live estimates would use routes for your chosen travel mode.':'Preview how approximate walking or driving times could appear alongside each pharmacy.'}</p></div>`;}
function travelEstimate(b){if(!travelPreviewMode)return '';const i=Math.max(0,BRANCHES.findIndex(x=>x.id===b.id)),minutes=(travelPreviewMode==='walking'?[12,25,40,55]:[5,10,15,20])[i%4];return `<span class="travel-estimate">${icon('clock')} ≈ ${minutes}–${minutes+5} min ${travelPreviewMode==='walking'?'walk':'drive'} <small>Example</small></span>`;}
function comparisonSlider(k,beforeKey=k+'.before',afterKey=k+'.after'){
 const id=k.replaceAll('.','-');return `<figure class="comparison" style="--comparison-position:50%"><div class="comparison-stage" data-comparison-drag><div class="comparison-layer comparison-after">${ph(afterKey,'After image placeholder')}</div><div class="comparison-layer comparison-before">${ph(beforeKey,'Before image placeholder')}</div><span class="comparison-label comparison-label-before">${e('span',k+'.beforeLabel','Before')}</span><span class="comparison-label comparison-label-after">${e('span',k+'.afterLabel','After')}</span><div class="comparison-divider" aria-hidden="true"><span>↔</span></div></div><figcaption>${e('label',k+'.controlLabel','Drag to compare before and after',`for="${id}-slider"`)}<input class="comparison-range" id="${id}-slider" type="range" min="0" max="100" value="50" data-comparison aria-valuetext="50% before image revealed"><p class="small">${e('span',k+'.hint','Use the slider or arrow keys to reveal either image. Matched views of the same treatment area.')}</p></figcaption></figure>`;
}
function updateComparison(input){const value=Math.max(0,Math.min(100,Number(input.value)||0));input.closest('.comparison').style.setProperty('--comparison-position',value+'%');input.setAttribute('aria-valuetext',value+'% before image revealed');}
document.addEventListener('input',event=>{if(!isEditing()&&event.target.matches('[data-comparison]'))updateComparison(event.target);});
let comparisonPointer=null;
function moveComparison(event,stage){const rect=stage.getBoundingClientRect(),input=stage.closest('.comparison').querySelector('[data-comparison]');input.value=String(Math.round(Math.max(0,Math.min(100,(event.clientX-rect.left)/rect.width*100))));updateComparison(input);}
document.addEventListener('pointerdown',event=>{const stage=event.target.closest('[data-comparison-drag]');if(isEditing()||!stage||event.button!==0)return;comparisonPointer={stage,id:event.pointerId};stage.setPointerCapture(event.pointerId);moveComparison(event,stage);});
document.addEventListener('pointermove',event=>{if(comparisonPointer?.id===event.pointerId)moveComparison(event,comparisonPointer.stage);});
for(const type of ['pointerup','pointercancel'])document.addEventListener(type,event=>{if(comparisonPointer?.id===event.pointerId)comparisonPointer=null;});

function prepareBooking(){
 const sid=params.get('service'),did=params.get('doctor'),place=params.get('location');
 if(did&&DOCTORS.some(d=>d.id===did)){
  if(booking.doctor!==did)booking={...booking,doctor:did,service:'doctor-consultation',variant:'Consultation',preferredLocation:'',location:doctor(did).practices.some(p=>p.branch===place)?place:doctor(did).place,date:'',time:''};
  if(place&&doctor(did).practices.some(p=>p.branch===place))booking.location=place;
  booking.step=3;
 }else if(sid&&SERVICES.some(s=>s.id===sid)){
  if(booking.service!==sid||booking.doctor)booking={...booking,service:sid,doctor:'',variant:service(sid).variants[0],preferredLocation:'',location:'',date:'',time:''};
  booking.step=2;
 }else if(place&&BRANCHES.some(b=>b.id===place)){
  booking={...booking,service:'',doctor:'',variant:'',preferredLocation:place,location:place,date:'',time:'',step:1};
 }else if(!params.has('step')){booking.step=1;booking.preferredLocation='';}
 if(place&&sid&&service(sid).places.includes(place))booking.location=place;
 if(params.get('preferredDate')&&/^\d{4}-\d{2}-\d{2}$/.test(params.get('preferredDate')))booking.date=params.get('preferredDate');
 if(params.get('demo')==='1')booking={...booking,service:'health-check',doctor:'',variant:'Health Check',preferredLocation:'',location:'pieta',date:futureDates()[0],time:'09:00',step:3};
 const desired=Number(params.get('step')||booking.step||1);booking.step=Math.max(1,Math.min(4,Number.isFinite(desired)?desired:1));
 if(!booking.service&&!booking.doctor)booking.step=1;else if(booking.step>2&&!booking.location)booking.step=2;else if(booking.step>3&&(!booking.date||!booking.time))booking.step=3;

 Malta, providing pharmaceutical products alongside health and beauty services.')}<div class="grid two"><div class="panel">${e('h3',k+'.strategy.heading','Growing the network')}${e('p',k+'.strategy.text','The group’s published strategy combines improving its existing pharmacies with acquiring pharmacies in additional localities.')}</div><div class="panel">${e('h3',k+'.services.heading','Broadening services')}${e('p',k+'.services.text','Its stated plans include extending doctor consultations, health checks and cosmetic services through the pharmacy network.')}</div></div><section class="option-section">${e('h2',k+'.structure.heading','Company structure')}${e('p',k+'.structure.text','Individual pharmacy licences sit in separate group entities under JP Pharma. The investor section provides the group’s corporate and financial disclosures.')}<div class="structure-flow"><div>Brown’s Pharma Holdings plc</div><span>Group structure</span><div>JP Pharma subsidiaries</div><span>Individual licence holders</span><div>Pharmacy network</div></div><p class="small">Simplified content diagram; the full legal ownership chart should be supplied for design.</p></section>${a('investor?topic=governance','Meet the Board of Directors','btn primary',k+'.board')}`;}else if(topic==='governance'){content=`${e('h2',k+'.heading','Board of Directors')}<div class="grid two">${BOARD.map(p=>`<article class="card">${ph('board.'+p.id+'.image','Board portrait','short')}<div class="card-body">${e('h3','board.'+p.id+'.name',p.name)}${e('p','board.'+p.id+'.role',p.role)}${faq('board.'+p.id+'.bio',[["Background",p.bio]])}</div></article>`).join('')}</div><section class="option-section">${e('h2',k+'.committee.heading','Audit Committee')}${e('p',k+'.committee.text','Jacqueline Camilleri (Chair), Dr Mark Grech and Marthese Vella.')}<div class="grid two"><div class="panel">${e('h3',k+'.secretary.heading','Company Secretary')}${e('p',k+'.secretary.text','Dr Jean Carl Farrugia')}</div><div class="panel">${e('h3',k+'.auditor.heading','External Auditor')}${e('p',k+'.auditor.text','Equis Assurance Limited')}</div></div></section>`;}else if(topic==='shareholders'){content=`${e('h2',k+'.heading','Bondholder & shareholder information')}${e('p',k+'.text','Access the group’s published capital, ownership and bond information through its official disclosures.')}<div class="panel"><h3>3.9% Unsecured Callable Bonds 2027–2031</h3><p>Published issue: €13 million; nominal value €100 per bond.</p>${a(INVESTOR_SOURCES.shareholders,'View bond information and prospectus','btn quiet',k+'.prospectus')}</div><div class="actions" style="margin-top:24px">${a('investor?topic=financial','Financial statements','btn quiet')}${a('investor?topic=announcements','Company notices','btn quiet')}</div>`;}else if(topic==='news'){content=`<div class="grid two">${[['Brown’s Fiscal Year 2021 PR Release','Historical financial results coverage.'],['Brown’s joins The Quad Central tenant line-up','News about the pharmacy at The Quad Central.'],['Free delivery to POYC registered customers','Historical coverage of the delivery service.']].map(([t,p],i)=>`<article class="card"><div class="card-body">${e('h2',k+'.'+i+'.heading',t)}${e('p',k+'.'+i+'.text',p)}${a(INVESTOR_SOURCES.news,'Read existing coverage','text-link',k+'.'+i+'.link')}</div></article>`).join('')}</div>`;}else if(topic==='contact'){content=`<div class="panel">${e('h2',k+'.heading','Investor enquiries')}${e('p',k+'.text','Contact head office for help reaching the investor relations team.')}${a('mailto:customercare@brownspharmacy.eu','customercare@brownspharmacy.eu','text-link',k+'.email')}${e('p',k+'.address','Brown’s Q3, Level 2, Unit 1, Quad Central, Triq L-Esportaturi, Central Business District CBD1020','style="margin-top:24px"')}<p class="small">General customer care contact shown. Dedicated investor contact to be confirmed.</p></div>`;}else content=notice('Choose an investor section.');return `<div class="container body-pad">${intro(k+'.intro',title,'Company disclosures and investor resources.','Investor Relations')}${investorNav(topic)}${content}</div>`;}
function futureNotice(){return notice('Product catalogue preview. Service purchasing is available in the wireframe; online product sales and the final product range remain to be confirmed.');}

function shopCategory(code){return SHOP_CATEGORIES.find(c=>c.code===code);}
function productCategoryCard(c){return `<article class="category-card">${e('span','shop-categories.'+c.code+'.group',c.group,'class="eyebrow"')}${e('h3','shop-categories.'+c.code+'.name',c.name)}${a('category?id='+c.code,'Explore category','text-link','shop-categories.'+c.code+'.link')}</article>`;}
function shopSearch(prefix='shop-search'){return `<form class="shop-search" data-form="catalogue-filter">${field('q','Search products, brands or categories','search',params.get('q')||'','placeholder="What are you looking for?"',prefix)}<button class="btn primary">Search shop</button></form>`;}
function shopCategoriesPage(){const q=(params.get('q')||'').trim().toLowerCase(),group=params.get('group')||'',items=SHOP_CATEGORIES.filter(c=>(!group||c.group===group)&&(!q||(c.name+' '+c.source+' '+c.code).toLowerCase().includes(q)));return `<div class="container body-pad">${intro('shop-categories.intro','Shop by category.','Find your way to medicines, beauty and everyday care.','Shop')}${notice('Proposed category structure. Available ranges and online purchasing are still to be confirmed.')}<form class="filterbar" data-form="category-filter">${field('q','Find a category','search',params.get('q')||'','','category-filter')}${select('group','Department',[['','All departments'],...SHOP_GROUPS.map(g=>[g,g])],group,'','category-filter')}<button class="btn primary">Find categories</button></form><div class="results-count"><span>${items.length} categories</span>${a('categories','Clear filters','text-link')}</div>${items.length?SHOP_GROUPS.filter(g=>items.some(c=>c.group===g)).map(g=>`<section class="shop-department">${e('h2','shop-departments.'+SHOP_GROUPS.indexOf(g)+'.heading',g)}<div class="grid three">${items.filter(c=>c.group===g).map(productCategoryCard).join('')}</div></section>`).join(''):empty('No categories match','Try a different term or department.','categories','View all categories')}<div class="callout">${e('h2','shop-categories.services.heading','Looking for an appointment?')}${a('services','Explore health & beauty services','text-link','shop-categories.services.link')}</div></div>`;}
function shopFacet(name,label,options,selected){return `<details class="shop-facet"><summary>${e('span','catalogue-filter.'+name+'.label',label)}${selected.length?`<span class="facet-count">${selected.length} selected</span>`:''}</summary><fieldset class="facet-options"><legend class="sr-only">${esc(label)}</legend>${options.map(([value,text])=>`<label class="facet-option"><input type="checkbox" name="${name}" value="${esc(value)}" ${selected.includes(value)?'checked':''}><span>${esc(text)}</span></label>`).join('')}</fieldset></details>`;}
function priceSlider(min,max){const limit=Math.max(50,Math.ceil(Math.max(...PRODUCTS.map(p=>p.price),min||0,max||0)/10)*10),low=min??0,high=max??limit;return `<fieldset class="shop-price"><legend>${e('span','catalogue.price.heading','Price range (€)')}</legend><div class="price-slider" style="--price-low:${low/limit*100}%;--price-high:${high/limit*100}%"><div class="price-track" aria-hidden="true"></div><label class="sr-only" for="shop-price-min">Minimum price</label><input id="shop-price-min" name="min" type="range" min="0" max="${limit}" step="1" value="${low}" data-price-bound="min" aria-valuetext="${money(low)}"><label class="sr-only" for="shop-price-max">Maximum price</label><input id="shop-price-max" name="max" type="range" min="0" max="${limit}" step="1" value="${high}" data-price-bound="max" data-default="${limit}" aria-valuetext="${money(high)}"></div><div class="price-readout" aria-live="polite"><output for="shop-price-min" data-price-output="min">${money(low)}</output><span>–</span><output for="shop-price-max" data-price-output="max">${money(high)}</output></div></fieldset>`;}
function updatePriceSlider(input){const area=input.closest('.shop-price'),low=area.querySelector('[name=min]'),high=area.querySelector('[name=max]');if(input.dataset.priceBound==='min')low.value=String(Math.min(Number(low.value),Number(high.value)));else high.value=String(Math.max(Number(high.value),Number(low.value)));for(const control of [low,high]){area.querySelector('[data-price-output="'+control.name+'"]').textContent=money(Number(control.value));control.setAttribute('aria-valuetext',money(Number(control.value)));}const track=area.querySelector('.price-slider');track.style.setProperty('--price-low',Number(low.value)/Number(low.max)*100+'%');track.style.setProperty('--price-high',Number(high.value)/Number(high.max)*100+'%');}
document.addEventListener('input',event=>{if(!isEditing()&&event.target.matches('[data-price-bound]'))updatePriceSlider(event.target);});
function productArchive(context={}){
 const q=(params.get('q')||'').trim().toLowerCase(),categories=context.category?[context.category]:params.getAll('category').filter(Boolean),brands=context.brand?[context.brand]:params.getAll('brand').filter(Boolean),sort=params.get('sort')||'featured';
 const priceValue=name=>{const raw=params.get(name);return raw!==null&&raw.trim()!==''&&Number.isFinite(Number(raw))&&Number(raw)>=0?Number(raw):null;},min=priceValue('min'),max=priceValue('max'),invalid=min!==null&&max!==null&&min>max;
 let items=PRODUCTS.filter(p=>{const c=shopCategory(p.category);return (!q||(p.name+' '+p.brand+' '+c.name+' '+c.source+' '+c.code).toLowerCase().includes(q))&&(!categories.length||categories.includes(p.category))&&(!brands.length||brands.includes(p.brand))&&(min===null||p.price>=min)&&(max===null||p.price<=max);});
 if(sort==='price-low')items.sort((a,b)=>a.price-b.price);if(sort==='price-high')items.sort((a,b)=>b.price-a.price);if(sort==='name')items.sort((a,b)=>a.name.localeCompare(b.name));
 const p=paginate(items,12),base=context.category?'category?id='+context.category:context.brand?'brand?name='+encodeURIComponent(context.brand):'catalogue',remove=(name,value)=>{const query=new URLSearchParams(params);if(value===undefined)query.delete(name);else{const remaining=query.getAll(name).filter(v=>v!==value);query.delete(name);remaining.forEach(v=>query.append(name,v));}query.delete('page');return active+(query.size?'?'+query:'');};
 const chips=[q&&['q','Search: '+(params.get('q')||'')],...(!context.category?categories.map(c=>['category',shopCategory(c)?.name||c,c]):[]),...(!context.brand?brands.map(b=>['brand',b,b]):[]),min!==null&&['min','From '+money(min)],max!==null&&['max','Up to '+money(max)]].filter(Boolean);
 return `<form class="shop-archive" data-form="catalogue-filter" data-base="${esc(active)}">${context.category?`<input type="hidden" name="id" value="${esc(context.category)}">`:''}${context.brand?`<input type="hidden" name="name" value="${esc(context.brand)}">`:''}<aside class="shop-filter-panel"><details open><summary>Filter products${chips.length?` <span class="filter-count">${chips.length}</span>`:''}</summary><div class="shop-filter-fields">${!context.category?shopFacet('category','Categories',SHOP_CATEGORIES.map(c=>[c.code,c.name]),categories):''}${!context.brand?shopFacet('brand','Brands',BRANDS.map(b=>[b,b]),brands):''}${priceSlider(min,max)}<button class="btn primary full">Apply filters</button>${a(base,'Reset filters','text-link')}</div></details></aside><div class="shop-results"><div class="shop-toolbar"><div class="field archive-search">${e('label','catalogue-filter.q.label','Search products','for="catalogue-filter-q"')}<div class="archive-search-input"><input type="search" id="catalogue-filter-q" name="q" value="${esc(params.get('q')||'')}" placeholder="Search the range"><button class="search-inside" type="submit" aria-label="Search products">${icon('search')}</button></div></div>${select('sort','Sort by',[['featured','Featured'],['price-low','Price: low to high'],['price-high','Price: high to low'],['name','Name: A–Z']],sort,'data-change="shop-sort"','catalogue-filter')}</div><div class="results-count"><span>${p.label} example products</span>${a('categories','All categories','text-link')}</div>${chips.length?`<nav class="filter-chips" aria-label="Active product filters">${chips.map(([name,label,value])=>`<a href="#${esc(remove(name,value))}" aria-label="Remove ${esc(label)}">${esc(label)} <span aria-hidden="true">×</span></a>`).join('')}</nav>`:''}${invalid?`<div class="error" role="alert"><h2>Check your price range</h2><p>The maximum price must be equal to or greater than the minimum.</p>${a(remove('max'),'Clear maximum price','text-link')}</div>`:items.length?`<div class="grid three product-grid">${p.items.map(productCard).join('')}</div>${p.nav}`:empty('No products to show',context.category&&!q&&!brands.length&&min===null&&max===null?'Products for this category have not yet been supplied.':'Try another search, brand or price range.',base,'Reset filters')}<p class="small catalogue-note">Example products and prices for the wireframe. The final range, product information and availability will be supplied by Brown’s.</p></div></form>`;
}
function shopCategoryPage(){const c=shopCategory(params.get('id'))||SHOP_CATEGORIES[0],k='shop-categories.'+c.code;return `<div class="container body-pad">${intro(k+'.intro',c.name,'Browse the range and narrow your search by brand or price.',c.group)}${productArchive({category:c.code})}</div>`;}

function relatedProducts(product){const rank=p=>p.category===product.category?3:product.brand&&p.brand===product.brand?2:shopCategory(p.category)?.group===shopCategory(product.category)?.group?1:0;return PRODUCTS.filter(p=>p.id!==product.id&&rank(p)>0).sort((a,b)=>rank(b)-rank(a)).slice(0,4);}
function productPage(){const p=PRODUCTS.find(x=>x.id===params.get('id'))||PRODUCTS[0],k='products.'+p.id,related=relatedProducts(p);return `<div class="container body-pad">${futureNotice()}${intro(k+'.intro',p.name,'[CLIENT CONTENT: approved product introduction.]',p.brand)}<div class="split" style="align-items:start">${ph(k+'.image','Product image','tall')}<div>${e('h2',k+'.details.heading','Product information')}<div class="product-price">${money(p.price)} <small>example price</small></div>${a('category?id='+p.category,shopCategory(p.category).name,'text-link')}${e('p',k+'.details.text','[CLIENT DATA: product range, format, size, variants and availability.]')}${select('variant','Product variant',[['sample','[Variant to be supplied]']],'sample','',k)}${notice('Catalogue information only. Online purchasing, eligibility and any prescription restrictions have not been confirmed.')}${a('pharmacies','Ask your pharmacy','btn primary',k+'.enquire')}<div style="margin-top:28px">${faq(k+'.accordions',[['Product details','[CLIENT CONTENT: approved description and specifications.]'],['Directions and suitability','[CLIENT CONTENT: approved usage information and restrictions.]']])}</div></div></div>${related.length?`<section class="section related-products">${sectionHead(k+'.related.heading','Related products.','category?id='+p.category,'Explore this category')}<div class="grid four">${related.map(productCard).join('')}</div></section>`:''}</div>`;}
function brandsPage(){const q=(params.get('q')||'').trim().toLowerCase(),items=BRANDS.filter(b=>!q||b.toLowerCase().includes(q)).sort();return `<div class="container body-pad">${intro('brands.intro','Shop by brand.','Explore our brands, then filter their products by category and price.','Shop')}<form class="shop-search" data-form="brand-filter">${field('q','Find a brand','search',params.get('q')||'','','brand-filter')}<button class="btn primary">Find brand</button></form><div class="results-count"><span>${items.length} brands</span>${a('brands','Clear search','text-link')}</div><div class="grid three">${items.map(b=>`<article class="card"><div class="card-body">${e('h2','brands.'+b.toLowerCase().replaceAll(' ','-')+'.name',b)}${a('brand?name='+encodeURIComponent(b),'Shop brand','text-link','brands.'+b.toLowerCase().replaceAll(' ','-')+'.link')}</div></article>`).join('')}</div>${!items.length?empty('No brands match','Try another name.','brands','View all brands'):''}</div>`;}
function brandPage(){const b=BRANDS.includes(params.get('name'))?params.get('name'):BRANDS[0],k='brands.'+b.toLowerCase().replaceAll(' ','-');return `<div class="container body-pad">${intro(k+'.intro',b,'[CLIENT CONTENT: approved brand introduction.]','Shop by brand')}${productArchive({brand:b})}</div>`;}
function notFound(){return `<div class="container confirmation"><div class="narrow">${intro('notfound.intro','Let’s get you back on track.','This page or item could not be found. Try one of these useful starting points.','Page not found')}<div class="actions">${a('home','Back to home','btn primary','notfound.home')}${a('services','Explore services','btn quiet','notfound.services')}${a('pharmacies','Find a pharmacy','btn quiet','notfound.pharmacies')}</div></div></div>`;}
function referenceIntro(title,text,label){return `<div class="page-intro"><span class="eyebrow">${esc(label)}</span><h1>${esc(title)}</h1><p class="lead">${esc(text)}</p></div>`;}
function architecturePage(){const reference=['architecture','components','states'],future=[];const group=(title,links)=>`<section class="sitemap-group"><h3>${title}</h3>${links.map(([r,t,type])=>`<a href="#${esc(r)}">${esc(t)}<small>${esc(type||'')}</small></a>`).join('')}</section>`;return `<div class="container body-pad"><div class="reference-banner">SANCHO handover reference · Architecture and scope for Neil, Salvatore and Brown’s review. This page is not part of the customer website.</div>${referenceIntro('The structure behind the experience.','Pages, reusable templates, connected journeys and the decisions still to confirm.','Site Architecture')}<div class="grid four" style="margin-bottom:32px">${[[PAGES.length,'review screen entries'],[SERVICES.length,'service detail examples'],[BRANCHES.length,'pharmacies in the directory'],['2','separate transaction journeys']].map(([n,t])=>`<div class="panel"><h2>${n}</h2><p class="small" style="margin:0">${t}</p></div>`).join('')}</div><p>Screen entries are not unique design-page counts. Archives, individual content records and interaction states reuse the templates identified below.</p><div class="actions" style="margin-bottom:35px">${a('components','Explore Component Library','btn primary')}${a('states','Review Interaction States','btn quiet')}</div><section class="section"><h2>Navigation priorities</h2><div class="grid three"><div class="panel"><h3>Main navigation</h3><p>Health · Beauty · Shop & Brands · Find a Doctor · Pharmacies</p><p>Direct service dropdowns support returning users. All Services stays accessible through Explore services and both service dropdowns.</p></div><div class="panel"><h3>Always within reach</h3><p>Book an appointment · My Account · Basket</p><p>A floating booking entry point carries the current service or pharmacy into the journey. Suppressed inside booking, checkout and account.</p></div><div class="panel"><h3>Supporting navigation</h3><p>Our Team · Careers · Articles · Contact · Help</p><p>Investor Relations has a distinct top-right utility link and its own section navigation. Shop & Brands opens a dropdown for all products, categories and brands. Product and brand archives share category, brand and price filtering; the basket currently supports service purchasing.</p></div></div></section><section class="section"><h2>Content sitemap</h2><div class="grid three">${group('Services',[['services','All Services','A00 · Unified archive'],['other-health','Other Health Services','P08 · Enquiry'],['health','Health overview','A01 · Shared service archive'],['microbiome','Microbiome Clinic','P02 · Service family'],...SERVICES.filter(s=>s.category==='health').map(s=>['service?id='+s.id,s.name,'T01 · Service detail']),['other-health','Other Health Services','P08 · Enquiry route']])}${group('Beauty Services',[['beauty','Beauty overview','A01 · Shared service archive'],...SERVICES.filter(s=>s.category==='beauty').map(s=>['service?id='+s.id,s.name,'T01 · Treatment variant']),['book?category=beauty','Book a Consultation','Action → F01'],['beauty-results','Before & After','A08 · Comparison archive'],['beauty-faq','Beauty FAQs','P07 · FAQ variant']])}${group('Pharmacies & doctors',[['pharmacies','All Locations','A03 · Directory'],...BRANCHES.map(b=>['pharmacy?id='+b.id,b.name,'T03 · Branch template']),['doctors','Find a Doctor','A02 · Added to reconcile meeting requirement'],['doctor','Doctor detail','T02 · Practitioner']])}${group('People & careers',[['people','Our Team','A04 · People archive'],['pharmacists','Pharmacists','A04 · People archive'],['person','Team member profile','T04 · Person'],['careers','Careers','P03 · Landing'],['working','Working at Brown’s','T05 · Editorial'],['training','Training & Development','T05 · Editorial'],['vacancies','Current Vacancies','A05 · Archive'],['vacancy','Vacancy & application','T06 · Detail / handoff']])}${group('Investor Relations',INVESTOR_TOPICS.map(([id,t])=>[id==='overview'?'investors':'investor?topic='+id,t,id==='overview'?'P04 · Investor hub':'T08 / A07 · Content or document archive']))}${group('Articles',[['articles','All Articles','A06 · Archive'],...CATEGORIES.slice(1).map(c=>['articles?category='+encodeURIComponent(c),c,'A06 · Filtered category']),['article','Individual article','T07 · Article']])}${group('Booking & purchasing',[['book','Book a service','F01 · 4 steps + confirmation'],['booking-confirmation','Appointment confirmation','F01.5 · Requires completed demo booking'],['service?id=health-check','Purchase a service','T01 · Purchase module'],['cart','Basket','F02.1'],['checkout','Checkout & payment','F02.2 · Simulated provider'],['order','Purchase confirmation','F02.3 · Separate scheduling']])}${group('Account & support',[['login','Login','F03.1'],['register','Registration','F03.2'],['password-reset','Password reset','F03.3'],['account','Account overview','P05'],...['appointments','profile','payments','rewards','help'].map(t=>['account?tab='+t,t,'P05 · Account section']),['help','Support / Help','P07'],['contact','Contact & HQ','P06'],['policy?topic=privacy','Privacy notice','T09'],['policy?topic=cookies','Cookie policy','T09'],['policy?topic=terms','Service terms','T09'],['not-found','404 recovery','S01']])}${group('Products & brands',[['shop','Shop overview','P09 · Shop landing'],['categories','Shop by category','A11 · Category index'],...SHOP_CATEGORIES.map(c=>['category?id='+c.code,c.name,'A09 · Category archive']),['catalogue','Shop All Products','A09 · Product archive'],['product','Product detail / variants','T10 · Product detail'],['brands','Our Brands','A10 · Brand archive'],...BRANDS.map(b=>['brand?name='+encodeURIComponent(b),b,'T11 · Shared brand landing'])])}</div></section><section class="section"><h2>The customer journeys</h2><div class="stack"><div class="panel"><h3>01 / Book a service</h3><p>Home, service or branch → service/option → pharmacy → date/time → add another visit if needed → shared details → confirmation for each appointment.</p>${a('book','Try the booking journey','btn quiet')}<p class="small" style="margin-top:16px">Guest booking and no upfront payment are proposed assumptions. Beauty starts with a consultation; final prerequisites remain to be agreed.</p></div><div class="panel"><h3>02 / Find a doctor</h3><p>Name / specialty / pharmacy → results → practitioner → example appointment journey or pharmacy contact.</p>${a('doctors','Try doctor discovery','btn quiet')}</div><div class="panel"><h3>03 / Purchase a service</h3><p>Service detail → option → basket → checkout → payment preview → order confirmation → arrange an appointment.</p>${a('service?id=health-check','Try service purchasing','btn quiet')}<p class="small" style="margin-top:16px">Order and appointment references are distinct. Redemption against a purchased entitlement is still an operational decision.</p></div><div class="panel"><h3>04 / Access an account</h3><p>Header account icon → account preview, login / registration → appointments, profile, payments, rewards and help.</p><p>The brief lists profile settings, appointments, payment methods, loyalty/rewards, help and logout. The platform, CMR definition and launch features are unspecified. All account screens are proposed designs pending confirmation of the platform.</p>${a('account','Review account entry','btn quiet')}</div></div></section><section class="section"><h2>Named screen inventory</h2><div class="table-wrap"><table class="inventory"><thead><tr><th>Screen</th><th>Page / template family</th><th>Purpose</th><th>Scope</th></tr></thead><tbody>${PAGES.map(p=>`<tr><td>${a(p.id,p.label)}</td><td>${esc(p.wp)}</td><td>${esc(p.description)}</td><td>${future.includes(p.id)?'Future':reference.includes(p.id)?'Review only':'Current wireframe'}</td></tr>`).join('')}</tbody></table></div></section><section class="section"><h2>Inventory category mapping</h2><p>Customer labels and departments below are proposals. Original inventory codes remain the connection to Brown’s records. An inventory category does not establish whether its products are eligible for online sale.</p><div class="table-wrap"><table class="inventory"><thead><tr><th>Code</th><th>Inventory name</th><th>Customer label</th><th>Proposed use</th></tr></thead><tbody>${INVENTORY_CATEGORIES.map(c=>`<tr><td>${c.code}</td><td>${esc(c.source)}</td><td>${c.kind==='category'?a('category?id='+c.code,c.name):esc(c.name)}</td><td>${c.kind==='category'?esc(c.group)+' · range to confirm':c.kind==='brand'?'Brand navigation / filter':c.kind==='service'?'Service journey · mapping to confirm':'Internal only · omitted from shop'}</td></tr>`).join('')}</tbody></table></div><p>Keep Eye medicines (11) distinct from Eye care (30), Skin treatments (13) from Skincare (22), and Nutrition & blood health (9) from Nutritional products (25). Confirm the GBY Christmas scope (35), General goods (50), and specialist medicine ranges before launch.</p></section><section class="section"><h2>Decisions and content still to confirm</h2><div class="table-wrap"><table class="inventory"><thead><tr><th>Area</th><th>Working assumption</th><th>Input needed</th></tr></thead><tbody>${[
 ['Booking','Service-first, guest details, no booking payment.','Brown’s: supported order of selections, consultation rules, guest policy, cancellation and rescheduling.'],
 ['Purchasing','Separate service checkout; schedule after purchase.','Brown’s: actual packages, variants, prices, fees, validity and entitlement redemption.'],
 ['Account','Login, registration, recovery and account screens are proposed designs.','Brown’s: platform, destination, CMR meaning, launch features and supported account actions.'],
 ['Locations & doctors','29 pharmacies and published visiting doctor records. New service mappings stay illustrative.','Brown’s: complete branch/doctor records, services by branch, hours, exceptions and schedules.'],
 ['Investor Relations','Map retained information into eight sitemap destinations.','Investor owner: complete retention inventory, original files and approval of proposed regrouping.'],
 ['Editorial & services','Meaningful draft copy and labelled content gaps.','Content owner: approved service copy, clinical review, biographies, articles, FAQs and careers content.'],
 ['Product catalogue','Proposed inventory mapping, shared product/category/brand archive and example price filtering.','Brown’s: confirm customer labels, launch ranges, online eligibility, stock, pricing and physical-product fulfilment.'],
 ['Design','Monochrome structure with image placeholders.','Salvatore: visual treatment informed by Seed and Tiny Health; exact reference sections to agree.']
 ].map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section></div>`;}

)}${componentBox('C08','Doctor result row','Practitioner identity, specialty, location context and detail action.',doctorRow(DOCTORS[0]))}${componentBox('C09','Branch result & opening hours','Branch identity, address, hours, direct call and direction actions. Holiday exceptions belong to the full detail page.',branchRow(BRANCHES[0]))}${componentBox('C10','Accordion group','Editable questions and answers. Keyboard-operable native disclosures; used for preparation, FAQs and supporting detail.',faq('components.accordions',[['What is this component for?','Use accordions for useful supporting detail. Keep essential booking information visible outside them.'],['Can the client edit the questions?','Yes. The reviewer editor can update, add or reorder this collection.']]))}${componentBox('C11','Form fields & validation','Persistent labels, required inputs, consent and a visible result. Try submitting an empty form.',`<form data-form="component-form">${field('name','Name','text','','required','component-form')}${field('email','Email address','email','','required','component-form')}<button class="btn primary">Send example</button><p id="component-result" role="status" style="margin-top:15px"></p></form>`)}${componentBox('C12','Choice cards & selection','Selected, unselected and unavailable choices; clear hit areas and visible labels.',`<fieldset style="border:0;padding:0"><legend>Example choices</legend>${choice('component-choice','one','First option','Available example',true)}${choice('component-choice','two','Second option','Available example')}${choice('component-choice','three','Third option','Unavailable example',false,true)}</fieldset>`)}${componentBox('C13','Appointment progress & summary','Four booking steps with a persistent summary and editable selections. The real journey enforces valid progression.',`<div class="actions">${a('book','Open the booking flow','btn quiet')}${a('states','Review error and empty states','text-link')}</div>`)}${componentBox('C14','Document archive row','Title, metadata and an explicit source action. The final archive can link directly to retained files.',documentRow('components.document','Document title','Reporting period · format · file size to confirm',INVESTOR_SOURCES.financial))}${componentBox('C15','Article card','Category, title, summary and a linked article detail.',`<div class="grid two">${ARTICLES.slice(0,2).map(articleCard).join('')}</div>`)}${componentBox('C16','Process / steps','Explain what a visit involves with short labelled steps.',processSteps('components.process',[['Choose your service','Start with the information you need.'],['Arrange your visit','Select a pharmacy and time.'],['Know what comes next','See clear preparation and follow-up instructions.']]))}${componentBox('C17','Empty results & recovery','Always offer a useful next action. Search state and filters remain visible.',empty('No results match','Try a broader search or remove a filter.','pharmacies','Explore pharmacies'))}${componentBox('C18','Notices, errors & confirmations','Monochrome states use headings and borders as well as text; meaning does not rely on colour.',`${notice('A useful piece of supporting information.')}<div class="error"><strong>Something needs your attention.</strong><br>Explain what happened and how to continue.</div><div class="panel"><div class="success-symbol">✓</div><h3>Action complete.</h3><p>State what happened and the next step.</p></div>`)}${componentBox('C19','Booking entry panel','A contextual entry point with a desktop panel and mobile-width layout. It is hidden during booking, checkout, account and purchase confirmation.',button('Open booking entry','open-book','btn primary'))}${componentBox('C20','Purchase module & basket','Variant selection, example price, add to basket, editable quantities and an order summary. Purchasing does not reserve a slot.',a('service?id=laser-hair-removal','Review service purchase options','btn quiet'))}${componentBox('C21','List / map directory','Both modes preserve the same filtered results. The map is a labelled schematic for the design handover.',mapPanel(BRANCHES))}${componentBox('C22','Category tabs & filters','Use the shared article archive for every editorial category, with search and clear-filter recovery.',`<div class="tabs">${CATEGORIES.map(c=>a('articles?category='+encodeURIComponent(c),c)).join('')}</div>`)}${componentBox('C23','Before / after comparison','Drag the slider or use its arrow keys. Upload matched views at the same angle and scale. Real assets and claims need approval.',comparisonSlider('components.comparison','components.before','components.after'))}${componentBox('C24','Account screens / application handoff','Login, registration, recovery and account screens are proposed designs; recruitment remains a separate handoff.',`<div class="actions">${a('account','Review account entry','btn quiet')}${a('vacancy','Review application entry','btn quiet')}</div>`)}${componentBox('C25','Pagination and large directories','Numbered pages retain filters. Branch directories use eight practitioner rows per page; the global directory uses twelve.',a('pharmacy?id=pharmacy-swieqi','Review a branch with 29 doctors','btn quiet'))}${componentBox('C26','Help topics and search','Topic sidebar, query state, grouped answers and no-results recovery.',a('help','Explore help topics','btn quiet'))}${componentBox('C27','Multiple appointments','Each visit has its own service, branch, date and time. Review, edit or remove visits before supplying shared contact details.',a('book','Try adding multiple services','btn quiet'))}${componentBox('C28','Commerce and brands','Shop dropdown and landing, category index, category archives, brand index and shared product filtering by category, brand, price and sort order.',a('shop','Explore Shop & Brands','btn quiet'))}</div>`;}

 ['Booking / loading','Show progress while availability is being checked.','book?demo=1&step=3&state=loading'],
 ['Booking / no availability','Keep selections and offer another date or pharmacy.','book?demo=1&step=3&state=no-slots'],
 ['Booking / slot no longer available','Explain the change and keep the rest of the journey.','book?demo=1&step=3&state=slot-lost'],
 ['Booking / submission failed','Retain the selections and allow a retry.','book?demo=1&step=4&state=submit-failed'],
 ['Booking / date-first proposal','An alternative journey for discussion, not an agreed booking rule.','states?view=date-first'],
 ['Doctor search / no results','Help users remove filters and broaden their search.','doctors?q=no-match'],
 ['Pharmacy search / no results','Offer another locality or service.','pharmacies?q=no-match'],
 ['Articles / no results','Keep the query visible and offer a reset.','articles?q=no-match'],
 ['Account / proposed screens','Explore the account features with no real authentication or stored credentials.','account'],
 ['Recovery / missing page','Return to useful customer routes.','not-found']
 ].map(([t,p,r])=>`<article class="panel"><h3>${t}</h3><p>${p}</p>${a(r,'Open state','btn quiet')}</article>`).join('')}<article class="panel"><h3>Checkout / payment failure</h3><p>Add one sample service and open the payment failure preview. Your current basket is preserved.</p>${button('Preview payment failure','seed-payment','btn quiet')}</article><article class="panel"><h3>Basket / empty</h3><p>Remove each item from the basket to inspect its recovery state. Quantities, limits and removal are all interactive.</p>${a('cart','Open basket','btn quiet')}</article></div><section class="section"><h2>Interaction behaviour for design</h2><ul class="list-plain"><li>Opening the booking panel moves focus into the dialog. Escape and the close button return focus to its trigger.</li><li>Changing a service resets incompatible location and time choices while keeping the entered contact details. Changing a date clears the selected slot.</li><li>Direct service, doctor and pharmacy links preselect relevant context. Back and change actions preserve compatible selections.</li><li>Availability and payment failure never show a success confirmation. Retry keeps the service basket or appointment context.</li><li>Mobile stacks summaries and fields, exposes navigation with a menu control and expands the booking entry panel to the available width.</li><li>Forms use required labels and browser validation. Contact details are held in memory only and cleared after a simulated completion.</li></ul></section></div>`;}
function paginate(items,size=12){
 const total=Math.max(1,Math.ceil(items.length/size)),page=Math.max(1,Math.min(total,Math.floor(Number(params.get('page')))||1));
 const link=(n,label=String(n),cls='page-number')=>{const query=new URLSearchParams(params);query.set('page',String(n));return `<a class="${cls}" href="#${esc(active+'?'+query)}" aria-label="${n===page?'Current page, ':''}Page ${n}" ${n===page?'aria-current="page"':''}>${label}</a>`;};
 const numbers=[...new Set([1,page-1,page,page+1,total])].filter(n=>n>=1&&n<=total).sort((a,b)=>a-b);
 let previous=0;const links=numbers.map(n=>{const gap=n-previous>1?'<span class="page-gap" aria-hidden="true">…</span>':'';previous=n;return gap+link(n);}).join('');
 return {items:items.slice((page-1)*size,page*size),nav:total>1?`<nav class="pagination" aria-label="Result pages">${page>1?link(page-1,'← Previous','page-direction'):'<span class="page-direction" aria-disabled="true">← Previous</span>'}<span class="page-numbers">${links}</span><span class="page-mobile">${page} / ${total}</span>${page<total?link(page+1,'Next →','page-direction'):'<span class="page-direction" aria-disabled="true">Next →</span>'}</nav>`:'',label:items.length?`${(page-1)*size+1}–${Math.min(page*size,items.length)} of ${items.length}`:'0'};
}
function servicesPage(){const cat=params.get('category')||'',q=(params.get('q')||'').toLowerCase(),items=SERVICES.filter(s=>(!cat||s.category===cat)&&(!q||(s.name+' '+s.group+' '+s.text).toLowerCase().includes(q)));return `<div class="container body-pad">${intro('services.archive','Find the right service for you.','Browse all our health and beauty services, or go straight to the area you need.','All services')}<div class="grid two category-doors">${[['health','Health services','Tests, checks and the Microbiome Clinic.'],['beauty','Beauty services','Treatments, consultations and beauty care.']].map(([id,t,p])=>`<article class="panel">${e('h2','services.door.'+id+'.title',t)}${e('p','services.door.'+id+'.text',p)}${a(id,'Explore '+id+' services','btn quiet','services.door.'+id+'.link')}</article>`).join('')}</div><form class="filterbar" data-form="service-filter">${field('q','Search all services','search',params.get('q')||'','placeholder="Service name or area of care"','all-services')}${select('category','Category',[['','Health & Beauty'],['health','Health'],['beauty','Beauty']],cat,'','all-services')}<button class="btn primary">Search services</button></form><div class="results-count"><span>${items.length} services</span>${a('services','Clear filters','text-link')}</div><div class="grid three">${items.length?items.map(s=>serviceCard(s)).join(''):empty('No services found','Try a different search or browse a category.','services')}</div><section class="callout">${e('h2','services.other.heading','Looking for something else?')}${e('p','services.other.text','Our pharmacies can help with enquiries about other health services.')}${a('other-health','Other health services','btn quiet','services.other.link')}</section></div>`;}

function distanceTo(b){if(!userPosition||!b.lat||!b.lng)return Infinity;const r=x=>x*Math.PI/180,lat=r(b.lat-userPosition.lat),lng=r(b.lng-userPosition.lng);return 6371*2*Math.asin(Math.sqrt(Math.sin(lat/2)**2+Math.cos(r(userPosition.lat))*Math.cos(r(b.lat))*Math.sin(lng/2)**2));}

 if(name==='account-reschedule'){if(!bookingDone)bookingDone={appointments:[{name:'Health Check',service:'health-check',variant:'Health Check',location:'pieta',date:futureDates()[1],time:'10:30'}]};const i=Number(form.dataset.index),v=bookingDone.appointments[i];if(v){v.date=values.date;v.time=values.time;}closeDialog();go('account?tab=appointments');toast('Example appointment rescheduled.');}
 if(name==='finder')go('service?id='+encodeURIComponent(values.service));
 if(name==='home-location')go('pharmacies?'+new URLSearchParams(values));
 if(name==='service-filter')go(active+'?'+new URLSearchParams(values));
 if(name==='pharmacy-filter')go('pharmacies?'+new URLSearchParams(values));
 if(name==='doctor-filter')go('doctors?'+new URLSearchParams(values));
 if(name==='article-filter')go('articles?'+new URLSearchParams(values));
 if(name==='vacancy-filter')go('vacancies?'+new URLSearchParams(values));
 if(name==='results-filter')go('beauty-results?'+new URLSearchParams(values));
 if(name==='investor-filter')go('investor?'+new URLSearchParams(values));
 if(name==='catalogue-filter'){const base=['catalogue','category','brand'].includes(form.dataset.base)?form.dataset.base:'catalogue';const clean=new URLSearchParams();for(const [key,value] of new FormData(form)){if(value===''||(key==='min'&&Number(value)===0)||(key==='max'&&value===form.querySelector('[data-price-bound=max]')?.dataset?.default))continue;clean.append(key,value);}go(base+(clean.size?'?'+clean:''));}
 if(name==='category-filter')go('categories?'+new URLSearchParams(values));
 if(name==='brand-filter')go('brands?'+new URLSearchParams(values));
 if(name==='quick-book'){go('book?'+new URLSearchParams(values));}
 if(name==='add-cart'){addCart(form.dataset.service,values.variant);go('cart');toast('Service added. Your appointment is arranged separately.');}
 if(name==='booking'){
  if(booking.step===1){if(values.service!=='doctor-consultation'&&!SERVICES.some(s=>s.id===values.service))return;setBookingService(values.service);booking.step=2;go(bookingRoute(2));}
  else if(booking.step===2){if(!bookingService().places.includes(values.location))return;booking.variant=values.variant;setBookingLocation(values.location);booking.step=3;go(bookingRoute(3));}
  else if(booking.step===3){if(!values.date||values.date<futureDates()[0]||!['09:00','10:30','14:00','15:30','17:00'].includes(values.time))return;booking.date=values.date;booking.time=values.time;booking.step=4;go(bookingRoute(4));}
  else{booking.details={...values,consent:Boolean(values.consent)};const submit=form.querySelector('[type=submit]');submit.disabled=true;submit.textContent='Confirming example appointment…';setTimeout(()=>{if(active==='book'&&booking.step===4)completeBooking();},600);}
 }
 if(name==='checkout'){if(values.country==='other'&&!values.countryName?.trim()){form.elements.countryName.required=true;form.elements.countryName.reportValidity();return;}checkoutDraft=values;go('checkout?stage=payment');}
 if(name==='contact'){form.reset();go('contact?sent=1');}
 if(name==='component-form'){document.getElementById('component-result').textContent='Example form complete. Nothing was sent or saved.';form.reset();height();}
 if(name==='date-first')go('states?view=date-first&date='+encodeURIComponent(values.date));
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){document.querySelectorAll('.nav-disclosure[open]').forEach(item=>{item.open=false;item.querySelector('summary')?.focus();});if(mobileMenu){mobileMenu=false;document.getElementById('primary-nav')?.classList.remove('open');const toggle=document.querySelector('.menu-toggle');toggle?.setAttribute('aria-expanded','false');toggle?.focus();}height();}});
document.addEventListener('click',event=>{if(!event.target.closest('.nav-disclosure'))document.querySelectorAll('.nav-disclosure[open]').forEach(item=>{item.open=false;});});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
window.addEventListener('message',event=>{if(event.source!==parent||(location.protocol!=='file:'&&event.origin!==location.origin))return;if(event.data?.type==='wf:viewport')syncViewport();if(event.data?.type==='wf:open-book'&&!isEditing())openBooking();if(event.data?.type==='wf:go'&&typeof event.data.route==='string')go(event.data.route);});
window.addEventListener('resize',height);window.addEventListener('scroll',syncViewport,{passive:true});
try{if(parent!==window){parent.addEventListener('scroll',syncViewport,{passive:true});parent.addEventListener('resize',syncViewport);window.addEventListener('pagehide',()=>{parent.removeEventListener('scroll',syncViewport);parent.removeEventListener('resize',syncViewport);});}}catch{}
new ResizeObserver(height).observe(app);
render();
post({type:'wf:ready',pages:PAGES,notes:NOTES,linkTargets:LINK_TARGETS,route:routeString()});
